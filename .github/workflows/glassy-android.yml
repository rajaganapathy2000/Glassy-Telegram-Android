name: Glassy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare Glassy Firebase package entry
        run: |
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          p = Path("TMessagesProj_App/google-services.json")
          if p.exists():
              data = json.loads(p.read_text())
              clients = data.get("client", [])
              if not any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "org.telegram.messenger.glassy" for c in clients):
                  source = next((c for c in clients if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "org.telegram.messenger"), None)
                  if source:
                      clone = copy.deepcopy(source)
                      clone["client_info"]["android_client_info"]["package_name"] = "org.telegram.messenger.glassy"
                      clients.append(clone)
                      p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Configure Glassy Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path

          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()

          if not api_id.isdigit():
              raise SystemExit("TELEGRAM_API_ID secret is missing or invalid")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              raise SystemExit("TELEGRAM_API_HASH secret is missing or invalid")

          p = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          s = p.read_text()

          s, n1 = re.subn(
              r"public static int APP_ID = [0-9]+;",
              f"public static int APP_ID = {api_id};",
              s, count=1
          )
          s, n2 = re.subn(
              r'public static String APP_HASH = "[^"]*";',
              f'public static String APP_HASH = "{api_hash}";',
              s, count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely update both API credential fields")

          p.write_text(s)
          print("Glassy Telegram API credentials configured successfully.")
          PYTHON

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Glassy release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatGlassyRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glassy-telegram-apk
          path: TMessagesProj_App/build/outputs/apk/afatGlassy/release/*.apk
          if-no-files-found: error
          retention-days: 14
